# Copy into a docs repository as .github/workflows/drift.yml
#
# The products are checked out next to the docs, under their own names, so a
# config that says `path: ../dashboard` finds them. Nightly, because the docs
# are not what changes when a product does.
name: drift

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: pagebeam/pagebeam@v1
        with:
          products: |
            your-org/dashboard
          command: fix
          publish: 'true'
          token: ${{ secrets.PAGEBEAM_TOKEN }}
