# Copy into a docs repository as .github/workflows/drift.yml
name: drift

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: pagebeam/pagebeam@v1
        with:
          products: |
            your-org/dashboard
          command: fix
          publish: 'true'
          token: ${{ secrets.PAGEBEAM_TOKEN }}
