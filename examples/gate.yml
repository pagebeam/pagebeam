# Copy into a product repository to fail a pull request that breaks the docs.
#
# Only a proven finding that this change introduced fails it. Everything else
# is reported and passes.
name: docs gate

on: [pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: pagebeam/pagebeam@v1
        with:
          docs: your-org/docs
          profile: enforce
          token: ${{ secrets.PAGEBEAM_TOKEN }}
