# Publishing without a token anybody has to keep. npm is told to trust this
# workflow in this repository, and the identity GitHub issues for a run is what
# it checks, so there is no long-lived credential to leak or rotate.
#
# Every package names this file by name on npmjs.com. Renaming it stops
# publishing until they are told the new name.
name: publish

on:
  # Started by hand while the version still moves. A tag is for a release, and
  # releasing is a decision somebody makes rather than something that follows
  # from pushing.
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  # What npm checks instead of a token. Without it the run has no identity.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # The runner's npm is older than the one that knows how to do this.
      - run: npm install -g npm@latest
      - run: npm -v

      - run: npm ci
      - run: npm test

      # Tests build with the compiler, which leaves every package importing the
      # others. What is published is built by the bundler, and publishing
      # without this step ships a command whose first line asks for a package
      # nobody installs.
      - run: npm run build

      # Publishing cannot be taken back: a version number is spent the moment
      # it is used, whether or not what went out can run. So the last thing
      # before it is the only check that answers the question actually being
      # asked, which is not "do the tests pass" but "does what I am about to
      # send somebody work when they install it".
      #
      # 0.1.1 passed every test and could not start. It shipped the compiler's
      # output rather than the bundle, and nothing looked at what was in the
      # box.
      - name: Install what would be published, somewhere else, and use it
        run: |
          set -euo pipefail
          tarball="$(cd packages/cli && npm pack --silent --pack-destination "$RUNNER_TEMP")"

          # A documentation site and the product it describes, so the command
          # is asked to do its job rather than only to start.
          mkdir -p "$RUNNER_TEMP/site/docs" "$RUNNER_TEMP/site/app/pages"
          printf '# Guide\n\nPress **Save changes** to keep it.\n' > "$RUNNER_TEMP/site/docs/guide.md"
          printf '<template><button>Save changes</button></template>\n' > "$RUNNER_TEMP/site/app/pages/index.vue"

          mkdir -p "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --silent "$RUNNER_TEMP/$tarball"

          # Nothing of this repository is on the path here, so anything the
          # bundle failed to carry is missing rather than quietly resolved.
          pagebeam="$RUNNER_TEMP/elsewhere/node_modules/.bin/pagebeam"
          "$pagebeam" --help > /dev/null
          "$pagebeam" init --cwd "$RUNNER_TEMP/site" > /dev/null
          test -f "$RUNNER_TEMP/site/pagebeam.config.yaml"
          "$pagebeam" check --cwd "$RUNNER_TEMP/site" > "$RUNNER_TEMP/said.txt"

          grep -q "pages checked against" "$RUNNER_TEMP/said.txt"
          echo "what would be published installs elsewhere and runs:"
          sed 's/^/  /' "$RUNNER_TEMP/said.txt"

      # A tag says which version is being released, so one that disagrees with
      # the packages would publish something nobody asked for. Started by hand
      # there is no tag and nothing to disagree with.
      - name: Check the tag matches what the packages say
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Only what is published. The rest are how this repository divides
          # its work and are built into the command, so their versions say
          # nothing and holding a release to them stops one for no reason.
          tagged="${GITHUB_REF_NAME#v}"
          for dir in packages/*/; do
            private=$(node -p "require('./${dir}package.json').private === true")
            [ "$private" = true ] && continue
            said=$(node -p "require('./${dir}package.json').version")
            name=$(node -p "require('./${dir}package.json').name")
            if [ "$said" != "$tagged" ]; then
              echo "$name is $said but the tag says $tagged"
              exit 1
            fi
          done
          echo "what is published is $tagged"

      # One package. The rest are how this repository is divided and are built
      # into the command, so there is one thing to install, one version to
      # keep, and one registry setting to maintain.
      #
      # A version already on the registry is left alone rather than failing the
      # run. Releasing is then something that can be repeated: a tag pushed
      # twice, or a run retried after one package failed, finishes the job
      # instead of refusing because of the part that already worked.
      - name: Publish
        run: |
          for p in cli; do
            name=$(node -p "require('./packages/$p/package.json').name")
            version=$(node -p "require('./packages/$p/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            # Anything with a hyphen in its version is not finished, and
            # nothing unfinished becomes what `npm install` gives people.
            case "$version" in
              *-*) tag=next ;;
              *)   tag=latest ;;
            esac
            # Provenance names the commit and the workflow that built this,
            # which anybody can check against a public source repository.
            ( cd "packages/$p" && npm publish --access public --provenance --tag "$tag" )
          done
