<!doctype html><html><head><style>body{font:18px sans-serif;margin:30px}.grid{display:flex;gap:24px}button{padding:12px}dialog{border:1px solid #aaa}@media(max-width:600px){.grid{display:block}}</style></head><body><h1>Field catalogue</h1><button id="filters" aria-haspopup="dialog">Filter categories</button><section id="filter-panel" hidden><h2>Categories</h2><label>Category <select id="category"><option>All</option><option>Books</option></select></label></section><div class="grid"><article><h2>Field notebook</h2><p>$12.00</p></article><article><h2>Trail guide</h2><p>$18.00</p></article></div><button id="basket" aria-haspopup="dialog">Basket</button><dialog id="basket-dialog"><h2>Your basket</h2><p>Field notebook: $12.00</p><button id="close-basket">Close</button></dialog><script>document.querySelector('#filters').onclick=()=>document.querySelector('#filter-panel').hidden=false;document.querySelector('#basket').onclick=()=>document.querySelector('#basket-dialog').showModal();document.querySelector('#close-basket').onclick=()=>document.querySelector('#basket-dialog').close();</script></body></html>
