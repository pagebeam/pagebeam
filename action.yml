# actions/checkout refuses paths outside the workspace, so every repository is
# checked out inside it at <owner>/<name>. Repositories with the same owner are
# siblings there, as they usually are on a laptop, so `path: ../dashboard` in a
# config works in both places.
name: pagebeam
description: Check documentation against the product it describes, and propose the corrections.

inputs:
  checkout:
    description: Check out the application repository. Set false to use a caller-prepared checkout and explicit cwd.
    default: 'true'
  install:
    description: Application dependency command, run before capture. Also used for the baseline unless baseline-install overrides it.
    default: ''
  docs:
    description: >-
      The repository holding the documentation, as owner/name, when it is not
      this one. pagebeam runs from it, because that is where the config lives.
    required: false
    default: ''
  docs-ref:
    description: The branch of that repository to read. Its default branch when empty.
    required: false
    default: ''
  products:
    description: >-
      Other repositories the documentation describes, as owner/name, one per
      line. For a documentation repository whose config points at its products.
    required: false
    default: ''
  command:
    description: check, fix, or capture. Capture produces evidence without posting to the pull request.
    required: false
    default: check
  ref:
    description: Revision to check out. Capture defaults to the pull request head; other commands use the triggering revision.
    default: ''
  environment:
    description: Named capture environment.
    default: local
  capture-config:
    description: Optional capture configuration file, relative to cwd.
    default: ''
  target:
    description: Named tours target.
    default: local
  journeys:
    description: Explicit capture journeys, one name per line. Overrides changed-file selection.
    default: ''
  base:
    description: Base revision for changed-file selection. Defaults to the pull request base.
    default: ''
  changed-files:
    description: JSON file containing changed paths, relative to cwd.
    default: ''
  all:
    description: Explicitly capture every configured journey.
    default: 'false'
  mode:
    description: Capture execution style, saved or model.
    default: saved
  purpose:
    description: capture, check, or both.
    default: both
  compare-base:
    description: Git revision to prepare automatically as the frontend baseline. Reuses the selected environment and target.
    default: ''
  baseline-install:
    description: Project installation command to run in the baseline repository, in any language.
    default: ''
  compare-environment:
    description: Optional independently prepared base environment.
    default: ''
  compare-target:
    description: Base tours target, required with compare-environment.
    default: ''
  profile:
    description: observe, enforce or enforce-all.
    required: false
    default: observe
  publish:
    description: Whether fix opens or updates the pull request. Without it, fix only says what it would propose.
    required: false
    default: 'false'
  build:
    description: >-
      Whether to build the documentation site first, so links are checked
      against the pages it publishes: auto, true or false. auto builds a docs
      site of its own whose framework is recognised, and skips docs that are
      part of an application. Dependencies are installed from the lockfile.
    required: false
    default: auto
  cwd:
    description: >-
      The folder holding the config, relative to the workspace. Defaults to the
      documentation checkout when `docs` is set, and to this repository otherwise.
    required: false
    default: ''
  version:
    description: Optional npm release. When omitted, builds the CLI from this action's pinned source.
    required: false
    default: ''
  token:
    description: >-
      A token that can read the other repositories and open a pull request in
      the documentation repository. Defaults to the job's own token, which only
      reaches this repository.
    required: false
    default: ''
  model-key:
    description: The model provider's key, as a secret. Exported under the name in `model-key-env`.
    required: false
    default: ''
  model-key-env:
    description: The environment variable the config's `model.apiKeyEnv` names.
    required: false
    default: OPENAI_API_KEY

outputs:
  directory:
    description: Directory containing capture runs, suitable for another upload or review tool.
    value: ${{ steps.run.outputs.directory }}
  report:
    description: Head run report file.
    value: ${{ steps.run.outputs.report }}
  gallery:
    description: HTML gallery with paired baseline images when comparison is requested.
    value: ${{ steps.run.outputs.gallery }}
  artifact-id:
    description: Capture artifact identifier for the separate reporting job.
    value: ${{ steps.captures.outputs.artifact-id }}
  artifact-url:
    description: Download location for capture evidence.
    value: ${{ steps.captures.outputs.artifact-url }}
  said:
    description: What the run reported.
    value: ${{ steps.run.outputs.said }}

runs:
  using: composite
  steps:
    - name: Check the repository names
      id: where
      shell: bash
      env:
        SELF: ${{ github.repository }}
        DOCS: ${{ inputs.docs }}
        PRODUCTS: ${{ inputs.products }}
      run: |
        set -euo pipefail
        valid() {
          [[ "$1" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+$ ]] && [[ "${1#*/}" != . && "${1#*/}" != .. ]]
        }
        for repo in "$SELF" $DOCS $PRODUCTS; do
          valid "$repo" || { echo "'$repo' is not a repository name in the form owner/name" >&2; exit 2; }
        done
        echo "self=$SELF" >> "$GITHUB_OUTPUT"

    # History is evidence: `strings` and `moved` read each repository's own.
    - uses: actions/checkout@v4
      if: inputs.checkout != 'false'
      with:
        ref: ${{ inputs.ref || (inputs.command == 'capture' && github.event.pull_request.head.sha) || github.sha }}
        path: ${{ steps.where.outputs.self }}
        fetch-depth: 0
        persist-credentials: false

    - name: Check out the documentation
      if: inputs.docs != ''
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.docs }}
        ref: ${{ inputs.docs-ref }}
        path: ${{ inputs.docs }}
        token: ${{ inputs.token || github.token }}
        fetch-depth: 0

    - name: Check out the products
      if: inputs.products != ''
      shell: bash
      env:
        PRODUCTS: ${{ inputs.products }}
        TOKEN: ${{ inputs.token || github.token }}
        SERVER: ${{ github.server_url }}
      run: |
        set -euo pipefail
        # In a header for this one command, so the token is not saved in .git/config.
        auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
        for repo in $PRODUCTS; do
          git -c "http.${SERVER}/.extraheader=${auth}" clone --quiet "${SERVER}/${repo}.git" "$GITHUB_WORKSPACE/${repo}"
        done

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build the pinned command
      if: inputs.version == ''
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npm run build

    # Away from the workspace, so a package.json there cannot decide which
    # pagebeam npx runs. In this repository it resolves to the unbuilt one.
    - name: Run
      id: run
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        GITHUB_TOKEN: ${{ inputs.token || github.token }}
        PAGEBEAM_COMMAND: ${{ inputs.command }}
        PAGEBEAM_PROFILE: ${{ inputs.profile }}
        PAGEBEAM_PUBLISH: ${{ inputs.publish }}
        PAGEBEAM_BUILD: ${{ inputs.build }}
        PAGEBEAM_CWD: ${{ inputs.cwd || inputs.docs || steps.where.outputs.self }}
        PAGEBEAM_VERSION: ${{ inputs.version }}
        MODEL_KEY: ${{ inputs.model-key }}
        MODEL_KEY_ENV: ${{ inputs.model-key-env }}
        CAPTURE_INSTALL: ${{ inputs.install }}
        CAPTURE_ENVIRONMENT: ${{ inputs.environment }}
        CAPTURE_CONFIG: ${{ inputs.capture-config }}
        CAPTURE_TARGET: ${{ inputs.target }}
        CAPTURE_JOURNEYS: ${{ inputs.journeys }}
        CAPTURE_BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        CAPTURE_CHANGED_FILES: ${{ inputs.changed-files }}
        CAPTURE_ALL: ${{ inputs.all }}
        CAPTURE_MODE: ${{ inputs.mode }}
        CAPTURE_PURPOSE: ${{ inputs.purpose }}
        CAPTURE_COMPARE_BASE: ${{ inputs.compare-base }}
        CAPTURE_BASELINE_INSTALL: ${{ inputs.baseline-install || inputs.install }}
        CAPTURE_COMPARE_ENVIRONMENT: ${{ inputs.compare-environment }}
        CAPTURE_COMPARE_TARGET: ${{ inputs.compare-target }}
      run: |
        set -uo pipefail

        if [ -n "$PAGEBEAM_VERSION" ]; then
          pagebeam=(npx --yes "pagebeam@$PAGEBEAM_VERSION")
        else
          pagebeam=(node "$GITHUB_ACTION_PATH/packages/cli/dist/main.js")
        fi

        if [ -n "$MODEL_KEY" ]; then
          if ! [[ "$MODEL_KEY_ENV" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "model-key-env: '$MODEL_KEY_ENV' is not a variable name" >&2
            exit 2
          fi
          export "$MODEL_KEY_ENV=$MODEL_KEY"
        fi

        case "$PAGEBEAM_CWD" in
          /*) cwd="$PAGEBEAM_CWD" ;;
          *) cwd="$GITHUB_WORKSPACE/$PAGEBEAM_CWD" ;;
        esac

        if [ "$PAGEBEAM_COMMAND" = capture ]; then
          unset GITHUB_TOKEN
          if [ -n "$CAPTURE_INSTALL" ]; then
            (cd "$cwd" && sh -c "$CAPTURE_INSTALL") || exit 2
          fi
        fi

        args=("$PAGEBEAM_COMMAND" --cwd "$cwd")
        # A release pinned from before --build existed would refuse the flag.
        if [ "$PAGEBEAM_COMMAND" != capture ] && [ "$PAGEBEAM_BUILD" != false ] && "${pagebeam[@]}" --help 2>/dev/null | grep -q -- '--build=auto'; then
          if [ "$PAGEBEAM_BUILD" = true ]; then args+=(--build); else args+=(--build=auto); fi
        fi
        if [ "$PAGEBEAM_COMMAND" = check ]; then
          args+=(--profile "$PAGEBEAM_PROFILE")
        elif [ "$PAGEBEAM_COMMAND" = fix ] && [ "$PAGEBEAM_PUBLISH" = true ]; then
          args+=(--publish)
        elif [ "$PAGEBEAM_COMMAND" = capture ]; then
          args+=(--json --environment "$CAPTURE_ENVIRONMENT" --target "$CAPTURE_TARGET" --mode "$CAPTURE_MODE" --purpose "$CAPTURE_PURPOSE" --out "$RUNNER_TEMP/pagebeam-captures")
          [ -z "$CAPTURE_CONFIG" ] || args+=(--config "$CAPTURE_CONFIG")
          while IFS= read -r journey; do
            [ -z "$journey" ] || args+=(--journey "$journey")
          done <<< "$CAPTURE_JOURNEYS"
          [ -z "$CAPTURE_BASE" ] || args+=(--base "$CAPTURE_BASE")
          [ -z "$CAPTURE_CHANGED_FILES" ] || args+=(--changed-files "$CAPTURE_CHANGED_FILES")
          [ "$CAPTURE_ALL" != true ] || args+=(--all)
          [ -z "$CAPTURE_COMPARE_BASE" ] || args+=(--compare-base "$CAPTURE_COMPARE_BASE")
          [ -z "$CAPTURE_BASELINE_INSTALL" ] || args+=(--baseline-install "$CAPTURE_BASELINE_INSTALL")
          [ -z "$CAPTURE_COMPARE_ENVIRONMENT" ] || args+=(--compare-environment "$CAPTURE_COMPARE_ENVIRONMENT")
          [ -z "$CAPTURE_COMPARE_TARGET" ] || args+=(--compare-target "$CAPTURE_COMPARE_TARGET")
        fi

        if [ "$PAGEBEAM_COMMAND" = capture ]; then
          "${pagebeam[@]}" "${args[@]}" | tee "$RUNNER_TEMP/said.txt"
          code=${PIPESTATUS[0]}
        else
          "${pagebeam[@]}" "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/said.txt"
          code=${PIPESTATUS[0]}
        fi

        if [ "$PAGEBEAM_COMMAND" = capture ]; then
          node --input-type=module <<'NODE'
        import fs from 'node:fs';
        import path from 'node:path';
        const directory = path.join(process.env.RUNNER_TEMP, 'pagebeam-captures');
        if (fs.existsSync(directory)) {
          let result;
          try { result = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'said.txt'), 'utf8')); } catch {}
          const gallery = result?.gallery ?? path.join(directory, 'index.html');
          const report = result ? path.join(result.directory, 'report.json') : '';
          const id = result?.report.id ?? `${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `directory=${directory}\nreport=${report}\ngallery=${gallery}\nrun-id=${id}\n`);
        }
        NODE
        fi

        # A line equal to the delimiter would end the output early.
        delimiter="PAGEBEAM_$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        while grep -qxF "$delimiter" "$RUNNER_TEMP/said.txt"; do
          delimiter="PAGEBEAM_$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        done
        {
          echo "said<<$delimiter"
          cat "$RUNNER_TEMP/said.txt"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"

        {
          echo "## pagebeam"
          echo
          echo '```'
          cat "$RUNNER_TEMP/said.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        exit "$code"

    - name: Retain capture evidence
      id: captures
      if: always() && inputs.command == 'capture' && steps.run.outputs.directory != ''
      uses: actions/upload-artifact@v4
      with:
        name: pagebeam-${{ steps.run.outputs.run-id }}
        path: ${{ steps.run.outputs.directory }}
        if-no-files-found: error

    - name: Link capture evidence
      if: always() && steps.captures.outputs.artifact-url != ''
      shell: bash
      env:
        CAPTURE_ARTIFACT_URL: ${{ steps.captures.outputs.artifact-url }}
      run: |
        printf '\nCapture evidence: %s\n' "$CAPTURE_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
