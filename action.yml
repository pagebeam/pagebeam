# actions/checkout refuses paths outside the workspace, so every repository is
# checked out inside it at <owner>/<name>. Repositories with the same owner are
# siblings there, as they usually are on a laptop, so `path: ../dashboard` in a
# config works in both places.
name: pagebeam
description: Check documentation against the product it describes, and propose the corrections.

inputs:
  docs:
    description: >-
      The repository holding the documentation, as owner/name, when it is not
      this one. pagebeam runs from it, because that is where the config lives.
    required: false
    default: ''
  docs-ref:
    description: The branch of that repository to read. Its default branch when empty.
    required: false
    default: ''
  products:
    description: >-
      Other repositories the documentation describes, as owner/name, one per
      line. For a documentation repository whose config points at its products.
    required: false
    default: ''
  command:
    description: check, to report, or fix, to propose.
    required: false
    default: check
  profile:
    description: observe, enforce or enforce-all.
    required: false
    default: observe
  publish:
    description: Whether fix opens or updates the pull request. Without it, fix only says what it would propose.
    required: false
    default: 'false'
  build:
    description: >-
      Whether to build the documentation site first, so links are checked
      against the pages it publishes: auto, true or false. auto builds a docs
      site of its own whose framework is recognised, and skips docs that are
      part of an application. Dependencies are installed from the lockfile.
    required: false
    default: auto
  cwd:
    description: >-
      The folder holding the config, relative to the workspace. Defaults to the
      documentation checkout when `docs` is set, and to this repository otherwise.
    required: false
    default: ''
  version:
    description: The pagebeam release to run. Defaults to the release this action is pinned to.
    required: false
    default: ''
  token:
    description: >-
      A token that can read the other repositories and open a pull request in
      the documentation repository. Defaults to the job's own token, which only
      reaches this repository.
    required: false
    default: ''
  model-key:
    description: The model provider's key, as a secret. Exported under the name in `model-key-env`.
    required: false
    default: ''
  model-key-env:
    description: The environment variable the config's `model.apiKeyEnv` names.
    required: false
    default: OPENAI_API_KEY

outputs:
  said:
    description: What the run reported.
    value: ${{ steps.run.outputs.said }}

runs:
  using: composite
  steps:
    - name: Check the repository names
      id: where
      shell: bash
      env:
        SELF: ${{ github.repository }}
        DOCS: ${{ inputs.docs }}
        PRODUCTS: ${{ inputs.products }}
      run: |
        set -euo pipefail
        valid() {
          [[ "$1" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+$ ]] && [[ "${1#*/}" != . && "${1#*/}" != .. ]]
        }
        for repo in "$SELF" $DOCS $PRODUCTS; do
          valid "$repo" || { echo "'$repo' is not a repository name in the form owner/name" >&2; exit 2; }
        done
        echo "self=$SELF" >> "$GITHUB_OUTPUT"

    # History is evidence: `strings` and `moved` read each repository's own.
    - uses: actions/checkout@v4
      with:
        path: ${{ steps.where.outputs.self }}
        fetch-depth: 0

    - name: Check out the documentation
      if: inputs.docs != ''
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.docs }}
        ref: ${{ inputs.docs-ref }}
        path: ${{ inputs.docs }}
        token: ${{ inputs.token || github.token }}
        fetch-depth: 0

    - name: Check out the products
      if: inputs.products != ''
      shell: bash
      env:
        PRODUCTS: ${{ inputs.products }}
        TOKEN: ${{ inputs.token || github.token }}
        SERVER: ${{ github.server_url }}
      run: |
        set -euo pipefail
        # In a header for this one command, so the token is not saved in .git/config.
        auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
        for repo in $PRODUCTS; do
          git -c "http.${SERVER}/.extraheader=${auth}" clone --quiet "${SERVER}/${repo}.git" "$GITHUB_WORKSPACE/${repo}"
        done

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    # Away from the workspace, so a package.json there cannot decide which
    # pagebeam npx runs. In this repository it resolves to the unbuilt one.
    - name: Run
      id: run
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        GITHUB_TOKEN: ${{ inputs.token || github.token }}
        PAGEBEAM_COMMAND: ${{ inputs.command }}
        PAGEBEAM_PROFILE: ${{ inputs.profile }}
        PAGEBEAM_PUBLISH: ${{ inputs.publish }}
        PAGEBEAM_BUILD: ${{ inputs.build }}
        PAGEBEAM_CWD: ${{ inputs.cwd || inputs.docs || steps.where.outputs.self }}
        PAGEBEAM_VERSION: ${{ inputs.version }}
        MODEL_KEY: ${{ inputs.model-key }}
        MODEL_KEY_ENV: ${{ inputs.model-key-env }}
      run: |
        set -uo pipefail

        version="$PAGEBEAM_VERSION"
        if [ -z "$version" ]; then
          version="$(node -p "require('$GITHUB_ACTION_PATH/packages/cli/package.json').version")"
        fi

        if [ -n "$MODEL_KEY" ]; then
          if ! [[ "$MODEL_KEY_ENV" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "model-key-env: '$MODEL_KEY_ENV' is not a variable name" >&2
            exit 2
          fi
          export "$MODEL_KEY_ENV=$MODEL_KEY"
        fi

        case "$PAGEBEAM_CWD" in
          /*) cwd="$PAGEBEAM_CWD" ;;
          *) cwd="$GITHUB_WORKSPACE/$PAGEBEAM_CWD" ;;
        esac

        args=("$PAGEBEAM_COMMAND" --cwd "$cwd")
        # A release pinned from before --build existed would refuse the flag.
        if [ "$PAGEBEAM_BUILD" != false ] && npx --yes "pagebeam@$version" --help 2>/dev/null | grep -q -- '--build=auto'; then
          if [ "$PAGEBEAM_BUILD" = true ]; then args+=(--build); else args+=(--build=auto); fi
        fi
        if [ "$PAGEBEAM_COMMAND" = check ]; then
          args+=(--profile "$PAGEBEAM_PROFILE")
        elif [ "$PAGEBEAM_PUBLISH" = true ]; then
          args+=(--publish)
        fi

        npx --yes "pagebeam@$version" "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/said.txt"
        code=${PIPESTATUS[0]}

        # A line equal to the delimiter would end the output early.
        delimiter="PAGEBEAM_$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        while grep -qxF "$delimiter" "$RUNNER_TEMP/said.txt"; do
          delimiter="PAGEBEAM_$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        done
        {
          echo "said<<$delimiter"
          cat "$RUNNER_TEMP/said.txt"
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"

        {
          echo "## pagebeam"
          echo
          echo '```'
          cat "$RUNNER_TEMP/said.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        exit "$code"
